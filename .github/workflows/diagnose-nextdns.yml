name: Diagnose NextDNS rewrites (read only)

on:
  push:
    branches: [fix/nextdns-rewrite-limit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: DNS
    env:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      REDIRECT: ${{ vars.REDIRECT }}
    steps:
      - uses: actions/checkout@v5
      - name: Read rewrite counts without changing the profile
        run: python3 scripts/diagnose_nextdns.py
